<path d="M36 44 Q36 10 70 10 Q104 10 104 44 V58 Q104 66 96 66 H44 Q36 66 36 58Z" fill="#CED7E0" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M44 22 Q56 14 70 14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<!-- visor with smug half-lidded eyes -->
<rect x="44" y="32" width="52" height="20" rx="9" fill="#0F1A24" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M52 42 h12 M76 42 h12" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
<path d="M50 37 l16 2 M74 39 l16 -2" stroke="#000" stroke-width="3" stroke-linecap="round"/>
<!-- smirk -->
<path d="M58 59 Q70 63 84 55" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
<!-- antenna -->
<path d="M70 10 V0" stroke="#000" stroke-width="3"/><circle cx="70" cy="2" r="4" fill="#39FF14" stroke="#000" stroke-width="2.5"/>
<!-- name badge -->
<rect x="80" y="86" width="20" height="9" fill="#00E5FF" stroke="#000" stroke-width="2"/>
</g>
</svg>
